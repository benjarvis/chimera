name: Extended diskfs allocation validation
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  allocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        guest: [ubuntu2404, ubuntu2604]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/fetch-oras
        with:
          arch: amd64
      - name: Build and exercise diskfs allocation
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          GUEST: ${{ matrix.guest }}
        run: |
          mkdir -p validation-logs
          docker run --rm --privileged \
            -e BUILD_TYPE -e GUEST -e EVPL_IO_URING_ENTRIES=1024 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/oras:/usr/local/bin/oras:ro" \
            -v /build -w /build \
            ghcr.io/chimera-nas/chimera-dev:7bc37cb993e3432d70fb815cf765681e1810cbfb-amd64 \
            bash -euxo pipefail -c '
              cmake -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
                -DREQUIRE_NETNS_TESTS=ON -DKVM_TESTING=ON -DKVM_FETCH_IMAGES=OFF /workspace
              ninja chimera diskfs_enospc_test diskfs_smoke_test posix_test_diskfs_enospc kvm_${GUEST}_image
              ctest -C extended --no-tests=error --output-on-failure \
                --test-output-size-failed 10485760 \
                -R "diskfs/(enospc_test|smoke_test)$|posix/diskfs_enospc_" \
                --output-junit /workspace/validation-logs/local.xml
              ctest -C extended --no-tests=error --output-on-failure \
                --test-output-size-failed 10485760 --repeat until-fail:2 \
                -R "^chimera/kvm/${GUEST}/nfstest/nfstest_alloc_diskfs_(aio|io_uring)_nfs4.2$" \
                --output-junit /workspace/validation-logs/kvm.xml
            ' 2>&1 | tee validation-logs/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diskfs-allocation-${{ matrix.build_type }}-${{ matrix.guest }}
          path: validation-logs/
