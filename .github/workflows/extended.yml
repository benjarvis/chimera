name: Extended SMB lease identity validation
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  leases:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 3
      - name: Build and exercise SMB leases
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          mkdir -p validation-logs
          docker run --rm --privileged \
            -e BUILD_TYPE -e EVPL_IO_URING_ENTRIES=1024 \
            -v "$GITHUB_WORKSPACE:/workspace" -v /build -w /build \
            ghcr.io/chimera-nas/chimera-dev:7bc37cb993e3432d70fb815cf765681e1810cbfb-amd64 \
            bash -euxo pipefail -c '
              git config --global --add safe.directory /workspace
              cmake -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
                -DREQUIRE_NETNS_TESTS=ON -DKVM_TESTING=OFF \
                -DWPTS_JUNIT_DIR=/workspace/validation-logs/wpts /workspace
              ninja chimera vfs_claim_test smb2_lease_identity_probe \
                smb2_oplock_probe smb2_replay_probe smb2_durable_probe smbtorture_test
              ctest -C extended --no-tests=error --output-on-failure \
                --test-output-size-failed 10485760 \
                -R "^chimera/vfs/claim_test$|^chimera/server/smb/mbt/(lease_identity|oplock|replay|durable)_probe_memfs$" \
                --output-junit /workspace/validation-logs/probes.xml
              ctest -C extended --no-tests=error --output-on-failure \
                --test-output-size-failed 10485760 --repeat until-fail:2 \
                -R "^chimera/server/smb/wpts/memfs(_encryption)?$" \
                --output-junit /workspace/validation-logs/wpts.xml
              ctest -C extended --no-tests=error --output-on-failure \
                --test-output-size-failed 10485760 \
                -R "^chimera/server/smb/smbtorture_smb2_(lease|oplock|replay)_memfs$" \
                --output-junit /workspace/validation-logs/smbtorture.xml
              for source in src/vfs/vfs_claim.c src/vfs/vfs_claim_break.c; do
                git -C /workspace show 7131ac64:"$source" > /workspace/"$source"
              done
              ninja smb2_lease_identity_probe
              if ctest -C extended --no-tests=error --output-on-failure \
                  -R "^chimera/server/smb/mbt/lease_identity_probe_memfs$" \
                  > /workspace/validation-logs/baseline.log 2>&1; then
                echo "ERROR: regression probe unexpectedly passed on the baseline"
                exit 1
              fi
              grep -F "same ClientLeaseId caused a break before second CREATE" \
                /workspace/validation-logs/baseline.log
            ' 2>&1 | tee validation-logs/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smb-lease-identity-${{ matrix.build_type }}
          path: validation-logs/
